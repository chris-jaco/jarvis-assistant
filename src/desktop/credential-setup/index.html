<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Configurar Atlas</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Configurar Atlas</h1>
    <p>La API key se guarda cifrada con la protección de tu usuario de Windows. Atlas nunca vuelve a mostrar la credencial almacenada.</p>
    <p id="status" role="status" aria-live="polite">Consultando estado…</p>
    <form id="credential-form" autocomplete="off">
      <label for="api-key">API key de OpenAI</label>
      <input id="api-key" name="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="8192" required>
      <div class="actions">
        <button id="save" type="submit">Guardar o reemplazar</button>
        <button id="clear" type="button">Limpiar campo</button>
      </div>
    </form>
    <div class="actions secondary">
      <button id="delete" type="button">Eliminar credencial</button>
      <button id="continue" type="button" hidden>Continuar a Atlas</button>
    </div>
    <p class="note">CONFIGURED significa que la credencial está almacenada, no que haya sido verificada con OpenAI.</p>
  </main>
  <script type="module" src="./renderer.ts"></script>
</body>
</html>
