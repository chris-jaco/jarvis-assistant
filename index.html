<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/brand/atlas-icon.svg">
  <meta name="theme-color" content="#080e18"><title>Atlas · Asistente personal</title>
</head>
<body data-state="disconnected">
<main>
  <header><h1 class="wordmark"><span class="brand-icon" aria-hidden="true"></span><span>Atlas<span class="brand-dot" aria-hidden="true">.</span></span></h1><span class="eyebrow">ASISTENTE PERSONAL</span></header>
  <section class="voice-stage" aria-label="Conversación con Atlas">
    <button id="session-toggle" class="orb-control" aria-label="Conectar con Atlas">
      <span id="atlas-orb" class="orb" aria-hidden="true"><span class="orb-core"></span><span class="orb-ring"></span></span>
    </button>
    <div class="state-line"><span class="state-dot" aria-hidden="true"></span><span id="state" role="status">Desconectado</span></div>
    <p id="message">Tocá el orb para conversar.</p>
    <button id="play" class="quiet-button" hidden>Activar audio</button>
    <button id="interrupt" class="quiet-button" hidden>Interrumpir</button>
  </section>
  <section id="transcript-scroll" class="transcript-scroll" aria-label="Conversación">
    <ol id="transcript" role="log" aria-label="Transcripción de la conversación" aria-live="polite" aria-relevant="additions text" data-empty></ol>
  </section>
  <footer>
    <p class="privacy-note">La conversación se envía a OpenAI. Al reconectar comienza una sesión nueva.</p>
    <details><summary>Detalles de sesión</summary><p id="metrics"></p><ul id="tool-activity" aria-label="Actividad de herramientas"></ul></details>
  </footer>
  <audio id="audio" autoplay></audio>
</main>
<dialog id="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="tool-confirmation confirmation-status">
  <span class="eyebrow">ATLAS</span><h2 id="confirmation-title">Confirmar acción</h2>
  <p id="tool-confirmation"></p><p id="confirmation-status" role="status"></p>
  <div class="dialog-actions"><button id="tool-reject">Cancelar</button><button id="tool-approve" class="primary">Confirmar</button></div>
</dialog>
<script type="module" src="/src/client/main.ts"></script>
</body></html>
